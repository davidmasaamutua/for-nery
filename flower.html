<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Gallery - For Nery</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div id="petals-container"></div>

    <div class="video-container">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-red-rose-petals-falling-2402-large.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
    </div>

    <main class="wrapper">
        <div class="glass-card">
            <h1 class="glow-text">Flower Gallery</h1>
            <p class="subtitle">A Collection of Beautiful Flowers</p>
            
            <div class="gallery">
                <div class="flower-item">
                    <img src="https://images.unsplash.com/photo-1518709268805-4e9042af2176?w=300" alt="Red Rose">
                    <p>Rose - Symbol of Love</p>
                </div>
                <div class="flower-item">
                    <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=300" alt="Tulip">
                    <p>Tulip - Perfect Love</p>
                </div>
                <div class="flower-item">
                    <img src="https://images.unsplash.com/photo-1464822759844-d150f39b8b3c?w=300" alt="Sunflower">
                    <p>Sunflower - Adoration</p>
                </div>
                <div class="flower-item">
                    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=300" alt="Lily">
                    <p>Lily - Purity</p>
                </div>
                <div class="flower-item">
                    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=300" alt="Daisy">
                    <p>Daisy - Innocence</p>
                </div>
                <div class="flower-item">
                    <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=300" alt="Orchid">
                    <p>Orchid - Beauty</p>
                </div>
            </div>

            <button class="primary-btn" onclick="window.location.href='index.html'">Back to Love Letter</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
