<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Nery</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div id="petals-container"></div>

    <div class="video-container">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-red-rose-petals-falling-2402-large.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
    </div>

    <main class="wrapper">
        <div class="glass-card">
            <h1 class="glow-text">Nery</h1>
            <p class="subtitle">My Everything</p>
            
            <div class="counter-container">
                <p class="counter-label">Days spent loving you:</p>
                <div id="love-counter">
                    <span id="days">00</span>d : <span id="hours">00</span>h : <span id="mins">00</span>m : <span id="secs">00</span>s
                </div>
            </div>

            <div class="divider"></div>
            
            <p class="main-caption">"In a garden full of flowers, I’d still pick you."</p>
            
            <button class="primary-btn" onclick="revealNote()">Open My Letter</button>

            <div id="secret-note" class="hidden-note">
                <p>Nery, you are the most beautiful person I know. Every second with you feels like a dream I never want to wake up from. 🌹</p>
                <span class="signature">Forever Yours, [David Mutuaz]</span>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
